services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${CRUCIBLE_BACKEND_PORT:-8000}:8000"
    volumes:
      - crucible_data:/app/data
      - crucible_uploads:/app/uploads
      - crucible_chroma:/app/chroma_db
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_PATH=/app/data/checkpoints.sqlite
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${CRUCIBLE_FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${CRUCIBLE_BACKEND_PORT:-8000}
      - PORT=3000
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  crucible_data:
  crucible_uploads:
  crucible_chroma:
