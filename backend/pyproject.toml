[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = true

# On Linux (the Docker image) torch comes from PyTorch's CPU index: the PyPI
# build bundles CUDA, about 4.5 GB of libraries the app never uses, since the
# only model it runs is the small embedding model. macOS wheels have no CUDA
# and stay on PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project]
name = "backend"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.22.1",
  "chromadb>=1.5.2",
  "fastapi>=0.128.4",
  "fastmcp>=3.1.0",
  "langchain-anthropic>=1.7.6,<2",
  "langchain-chroma>=1.1.0",
  "langchain-google-genai>=4.2.0,<5",
  "langchain-huggingface>=1.2.1",
  "langchain-openai>=1.1.7",
  "langgraph>=1.0.8",
  "langgraph-checkpoint>=4.0.0",
  "langgraph-checkpoint-sqlite>=3.0.3",
  "pydantic>=2.12.5",
  "pymupdf>=1.26.7",
  "python-dotenv>=1.2.1",
  "python-multipart>=0.0.22",
  "sentence-transformers>=5.2.3",
  "tiktoken>=0.12.0",
  "typer>=0.15.0",
  "rich>=14.0.0",
  "uvicorn>=0.40.0",
  "ordal>=0.11",
  "langchain-text-splitters>=1.1.3",
  "httpx>=0.28.1",
  "numpy>=2.5.4",
  "starlette>=1.9.0",
  # Not imported: sentence-transformers needs it. Declared so its source can be
  # chosen below.
  "torch>=2.14.1",
]

[project.scripts]
crucible = "app.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.19.1",
  "pyright>=1.1.408",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.2",
]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.pyright]
exclude = ["migrations", ".venv", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
# Spelled out so a ruff upgrade cannot change what the linter enforces: these
# are the rules ruff 0.15 selected by default. Adopting newer defaults (pyupgrade,
# import sorting, bugbear) is a separate, deliberate change.
select = ["E4", "E7", "E9", "F"]
